# Netlify reads this file automatically when it builds the site.
# The project lives in the `portfolio/` folder of this repository, so we tell Netlify to build there.

[build]
  base = "portfolio"
  command = "npm run build"
  # relative to `base`, so this is portfolio/dist
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Images, JS and CSS built by Vite have a unique name per version, so browsers can cache them forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
