<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nikola Zovko – Frontend Developer in Stockholm. React, JavaScript and modern web applications." />
    <meta name="theme-color" content="#f6f6fb" />
    <script>
      // Apply the saved theme before the page draws, so dark-mode visitors don't see a white flash
      try {
        if (localStorage.getItem('portfolio-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.background = '#07080f'
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Nikola Zovko | Frontend Developer</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
